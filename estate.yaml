# This repository's registry row. Fill it in at setup (SETUP.md, step 2), then keep it true.
# Field names match the estate registry, so your provider's registry can read this file as is.
# Register before you create: a new repo, Vercel project or Supabase project gets its row first.
version: 1
repo: ""                    # this repository's name, e.g. acme-os, or client-<slug>-os in a provider's org
kind_target: "instance"     # an instance holds one company's own context and records
repo_kind: "workspace"
ownership_scope: "company"  # "client" when a provider holds it for you until it moves to your own org
nn: 0
owner: ""                   # the accountable person (GitHub username)
github_org: ""              # where it lives
starter_release: ""         # filled from .aios/install.json, e.g. starter-3.0.0
hosting:                    # one row per deployed site (03_RevOps/site/); the Vercel project has the repo's name
  vercel_project: ""
  root_directory: "03_RevOps/site"
data:                       # a database this company owns, if any
  supabase_project: ""
note: ""
